name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.STAGING_FIREBASE_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.STAGING_FIREBASE_PROJECT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.STAGING_FIREBASE_APP_ID }}" >> .env.local
          echo "FIREBASE_PROJECT_ID=${{ secrets.STAGING_FIREBASE_PROJECT_ID }}" >> .env.local
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.STAGING_FIREBASE_CLIENT_EMAIL }}" >> .env.local
          echo "FIREBASE_PRIVATE_KEY=${{ secrets.STAGING_FIREBASE_PRIVATE_KEY }}" >> .env.local

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}'

      - name: Grant Secret Manager access to Service Account
        run: |
          SERVICE_ACCOUNT_EMAIL=$(cat "${{ steps.auth.outputs.credentials_file_path }}" | jq -r '.client_email')
          echo "Granting Secret Manager access to $SERVICE_ACCOUNT_EMAIL"
          gcloud secrets add-iam-policy-binding GEMINI_API_KEY \
            --member=serviceAccount:$SERVICE_ACCOUNT_EMAIL \
            --role=roles/secretmanager.secretAccessor \
            --project=${{ secrets.STAGING_FIREBASE_PROJECT_ID }} || echo "Warning: Failed to grant IAM policy, but continuing..."

      - name: Test Secret Manager access
        run: gcloud secrets describe GEMINI_API_KEY --project=${{ secrets.STAGING_FIREBASE_PROJECT_ID }}

      - name: Deploy to Firebase
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="${{ steps.auth.outputs.credentials_file_path }}"
          npx firebase-tools deploy --only hosting,functions \
            --project ${{ secrets.STAGING_FIREBASE_PROJECT_ID }} \
            --force
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Staging deployment successful!"
          echo "🔗 Staging URL: https://${{ secrets.STAGING_FIREBASE_PROJECT_ID }}.web.app"