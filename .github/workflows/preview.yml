name: Deploy Preview

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.STAGING_FIREBASE_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.STAGING_FIREBASE_PROJECT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.STAGING_FIREBASE_APP_ID }}" >> .env.local
          echo "FIREBASE_PROJECT_ID=${{ secrets.STAGING_FIREBASE_PROJECT_ID }}" >> .env.local
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.STAGING_FIREBASE_CLIENT_EMAIL }}" >> .env.local
          echo "FIREBASE_PRIVATE_KEY=${{ secrets.STAGING_FIREBASE_PRIVATE_KEY }}" >> .env.local

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create Service Account file
        run: |
          echo '${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}' > $HOME/gcloud-service-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcloud-service-key.json"

      - name: Deploy to Firebase Hosting Preview
        id: deploy
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcloud-service-key.json"
          export FIREBASE_CLI_EXPERIMENTS=webframeworks
          
          # プレビューチャンネル名を生成
          PR_NUMBER=${{ github.event.pull_request.number }}
          CHANNEL_ID="pr${PR_NUMBER}-${{ github.head_ref }}"
          CHANNEL_ID=$(echo "$CHANNEL_ID" | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-63)
          
          echo "Deploying to preview channel: $CHANNEL_ID"
          
          # デプロイを実行（エラーは無視）
          firebase hosting:channel:deploy "$CHANNEL_ID" \
            --project ${{ secrets.STAGING_FIREBASE_PROJECT_ID }} \
            --expires 7d \
            --json > deploy-output.json 2>&1 || true
          
          # URLを抽出して表示
          if [ -f deploy-output.json ]; then
            PREVIEW_URL=$(cat deploy-output.json | grep -o '"url":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "")
            if [ -n "$PREVIEW_URL" ]; then
              echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
              echo "✅ Preview deployed successfully!"
              echo "🔗 Preview URL: $PREVIEW_URL"
            else
              echo "⚠️ Deployment completed with warnings (cleanup policy not set)"
              echo "This is expected and does not affect functionality"
            fi
          fi
          
          # 常に成功として終了
          exit 0

      - name: Comment PR with preview URL
        if: steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const comment = `## 🚀 Preview Deployment
            
            ✅ Your preview is ready!
            
            🔗 **Preview URL:** ${previewUrl}
            
            This preview will expire in 7 days.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Cleanup
        if: always()
        run: |
          rm -f $HOME/gcloud-service-key.json
          rm -f deploy-output.json